[package]
name = "artesian-bench"
version.workspace = true
# Stays on edition 2021: these crates set process env vars, which edition 2024
# makes unsafe, and the workspace forbids unsafe on purpose. Finish the move
# once the env reads are injectable rather than global.
edition = "2021"
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
aquifer.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiktoken-rs.workspace = true
tokio.workspace = true

[dev-dependencies]
aquifer = { workspace = true, features = ["qdrant"] }

[lints]
workspace = true
