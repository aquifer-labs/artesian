[package]
name = "artesian-process-agent"
version.workspace = true
# Stays on edition 2021: these crates set process env vars, which edition 2024
# makes unsafe, and the workspace forbids unsafe on purpose. Finish the move
# once the env reads are injectable rather than global.
edition = "2021"
rust-version.workspace = true
license.workspace = true

[dependencies]
artesian-core = { path = "../artesian-core" }
futures-util.workspace = true
nix.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
artesian-test-support.workspace = true

[lints]
workspace = true
